<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CareerCompass IT</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a12; --surface: #0c1524; --surface2: #111d30; --border: #1e3152;
    --accent: #00d4ff; --accent2: #7c3aed; --accent3: #10b981; --warn: #f59e0b;
    --text: #e2eaf6; --muted: #6b83a4; --error: #ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    font-family:'DM Sans',sans-serif; 
    background:var(--bg); 
    color:var(--text); 
    min-height:100vh; 
    overflow-x:hidden; 
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  body::before { 
    content:''; 
    position:fixed; 
    inset:0;
    background: radial-gradient(ellipse 60% 50% at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 80% 80%, rgba(124,58,237,0.07) 0%, transparent 60%);
    pointer-events:none; 
    z-index:0; 
  }

  .login-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
  }

  .logo { 
    font-family:'Syne',sans-serif; 
    font-weight:800; 
    font-size:1.8rem; 
    letter-spacing:-0.5px;
    text-align: center;
    margin-bottom: 8px;
  }
  .logo span { color:var(--accent); }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 36px;
  }

  .auth-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .tab-switcher {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--bg);
    border-radius: 12px;
    padding: 4px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text);
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    transition: all 0.3s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: #000;
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0, 212, 255, 0.3);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .error-msg {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--error);
    padding: 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }

  .error-msg.show {
    display: block;
  }

  .success-msg {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: var(--accent3);
    padding: 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }

  .success-msg.show {
    display: block;
  }

  .form-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* Loading spinner */
  .spinner {
    border: 3px solid rgba(0, 212, 255, 0.1);
    border-top: 3px solid var(--accent);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
    display: inline-block;
    margin-left: 10px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Mobile responsiveness */
  @media (max-width: 480px) {
    .auth-box {
      padding: 24px;
    }
    
    .logo {
      font-size: 1.5rem;
    }
    
    .btn {
      padding: 12px;
      font-size: 0.95rem;
    }
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="logo">Career<span>Compass</span> IT</div>
  <div class="tagline">🎯 Smart Career Recommendation System</div>

  <div class="auth-box">
    <div class="tab-switcher">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <!-- Login Form -->
    <form id="loginForm" style="display:block">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="loginUsername" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">
        Login
      </button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" style="display:none">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="signupFullname" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="signupUsername" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="signupPassword" placeholder="Create a password (min 6 characters)" required>
      </div>

      <button type="submit" class="btn btn-primary" id="signupBtn">
        Create Account
      </button>
    </form>

    <div class="form-footer">
      Secure authentication powered by Flask
    </div>
  </div>
</div>

<script>
let currentTab = 'login';

function switchTab(tab) {
  currentTab = tab;
  
  // Update tab buttons
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  // Toggle forms
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  
  // Clear messages
  hideMessages();
}

function showError(message) {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = message;
  errorMsg.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}

function showSuccess(message) {
  const successMsg = document.getElementById('successMsg');
  successMsg.textContent = message;
  successMsg.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}

function hideMessages() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('successMsg').classList.remove('show');
}

// Login form handler
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = 'Logging in...<div class="spinner"></div>';
  
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  try {
    const response = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    
    const data = await response.json();
    
    if (data.success) {
      showSuccess('Login successful! Redirecting...');
      setTimeout(() => {
        window.location.href = data.is_admin ? '/admin' : '/dashboard';
      }, 1000);
    } else {
      showError(data.error || 'Login failed');
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  } catch (error) {
    showError('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});

// Signup form handler
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  
  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  btn.innerHTML = 'Creating account...<div class="spinner"></div>';
  
  const fullname = document.getElementById('signupFullname').value.trim();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  
  try {
    const response = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ fullname, username, password })
    });
    
    const data = await response.json();
    
    if (data.success) {
      showSuccess('Account created! Redirecting...');
      setTimeout(() => {
        window.location.href = '/';
      }, 1000);
    } else {
      showError(data.error || 'Registration failed');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  } catch (error) {
    showError('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});

// Check if user is already logged in
async function checkAuth() {
  try {
    const response = await fetch('/auth/status', { credentials: 'include' });
    const data = await response.json();
    
    if (data.authenticated) {
      window.location.href = '/';
    }
  } catch (error) {
    // User not authenticated, stay on login page
  }
}

checkAuth();
</script>

</body>
</html>
